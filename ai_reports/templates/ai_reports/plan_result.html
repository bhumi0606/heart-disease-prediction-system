{% extends "core/base.html" %}

{% block content %}

<div class="container mt-5 d-flex justify-content-center">

    <div class="card shadow-lg p-4"
         style="max-width:700px; width:100%; border-radius:15px;">

        <!-- Title -->
        <div>
            <h3 class="text-center mb-4">
                Personalized workout and diet plan generated using Artificial Intelligence
            </h3>
            

        </div>
        

        <hr>

        <!-- Output -->
        <div class="ai-output p-3"
             style="background:#f8fafc; border-radius:10px; line-height:1.7;">

            {{ plan.plan_text |safe }}

        </div>

        <hr>
            <div class="text-center mt-4">
                <a href="{% url 'ai_reports:download-plan' plan.id %}">Download</a>
            </div>

        
    </div>

</div>

{% endblock %}
