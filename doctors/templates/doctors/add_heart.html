{% extends "core/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="bg-light min-vh-100 py-5">
    <div class="container">

        <!-- Form Card -->
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

            <!-- Header -->
            <div class="text-center p-4">
                <h2 class="fw-bold mb-1">Add Heart Data</h2>
                <p class="mb-0">Enter patient details for heart disease prediction</p>
            </div>

            <!-- Card Body -->
            <div class="card-body p-5">

                <!-- Patient Info -->
                <div class="mb-4 text-center">
                    <h5 class="fw-semibold">{{ patient.patient_name }}</h5>
                    <p class="text-muted mb-0">Patient Record</p>
                </div>

                <!-- Form -->
                <form method="POST">
                    {% csrf_token %}

                    <!-- Display form -->
                    <fieldset class="form-group mb-4">
                        {{ form|crispy }}
                    </fieldset>

                    <!-- Buttons -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg px-5 me-2">
                            Save Details
                        </button>
                        <a href="{% url 'doctors:doctor-dashboard' %}" 
                           class="btn btn-outline-secondary btn-lg px-4">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
{% endblock content %}
